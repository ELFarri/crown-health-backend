<!DOCTYPE html>
<html>
<head>
    <title>Users List</title>
</head>
<body>

<h1>Users List</h1>

<table border="1">
<tr>
    <th>Name</th>
    <th>Email</th>
    <th>Age</th>
    <th>Goal</th>
</tr>

{% for user in users %}
<tr>
    <td>{{ user.name }}</td>
    <td>{{ user.email }}</td>
    <td>{{ user.age }}</td>
    <td>{{ user.goal }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
