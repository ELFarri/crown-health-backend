<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <title>Calal - Login</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, #4CAF50 0%, #81C784 100%);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .container { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%; max-width: 400px; 
        }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #e1e5e9; border-radius: 10px; font-size: 16px; }
        input:focus { outline: none; border-color: #4CAF50; }
        button { width: 100%; padding: 15px; background: #4CAF50; color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏃‍♀️ Calal</h1>
        <h2>Login</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
